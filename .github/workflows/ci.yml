name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  swift-tests:
    name: Swift Package Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate W3C conformance tests
        run: ./Scripts/w3c/generate-w3c-tests.sh Tests/SVGSwiftUITests/W3C/w3c-manifest.json Tests/SVGSwiftUITests/W3CGeneratedTests.swift

      - name: Generate WebKit conformance tests
        run: |
          ./Scripts/webkit/generate-webkit-tests.sh Tests/SVGSwiftUITests/WebKit/webkit-manifest.json Tests/SVGSwiftUITests/WebKitGeneratedTests.swift

      - name: Run swift test
        run: |
          swift --version
          swift test --parallel

      - name: Run W3C conformance tests
        run: |
          swift test --filter testW3CGeneratedSuite --no-parallel 2>&1 | tee w3c-conformance.log

      - name: Run WebKit conformance tests
        run: |
          swift test --filter testWebKitGeneratedSuite --no-parallel 2>&1 | tee webkit-conformance.log

      - name: Run S3 performance profile
        run: ./Scripts/performance/run-s3-profile.sh

      - name: Generate W3C coverage report
        if: always()
        run: ./Scripts/w3c/w3c-coverage.sh Tests/SVGSwiftUITests/W3C/w3c-manifest.json docs/W3C_COVERAGE.md --strict

      - name: Generate WebKit coverage report
        if: always()
        run: ./Scripts/webkit/webkit-coverage.sh Tests/SVGSwiftUITests/WebKit/webkit-manifest.json docs/WEBKIT_COVERAGE.md --strict

      - name: Upload W3C conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-conformance-${{ github.run_id }}
          path: |
            docs/W3C_COVERAGE.md
            Tests/SVGSwiftUITests/W3C/w3c-manifest.json
            Tests/SVGSwiftUITests/W3CGeneratedTests.swift
            w3c-conformance.log

      - name: Upload WebKit conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-conformance-${{ github.run_id }}
          path: |
            docs/WEBKIT_COVERAGE.md
            Tests/SVGSwiftUITests/WebKit/webkit-manifest.json
            Tests/SVGSwiftUITests/WebKitGeneratedTests.swift
            webkit-conformance.log

      - name: Upload S3 performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-performance-${{ github.run_id }}
          path: |
            s3-profile.log

  demo-uitests:
    name: Demo UITests
    runs-on: macos-latest
    timeout-minutes: 45
    needs: swift-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve iOS simulator destination
        id: destination
        run: |
          set -euo pipefail
          SHOW_DESTINATIONS=$(xcodebuild -project Examples/SVGSwiftUIDemo/SVGSwiftUIDemo.xcodeproj -scheme SVGSwiftUIDemo -showdestinations)
          DESTINATION_LINE=$(printf '%s\n' "$SHOW_DESTINATIONS" \
            | awk 'index($0, "platform:iOS Simulator") && /OS:/ && /name:iPhone 17/ && !/placeholder/ { print; exit }')

          if [ -z "$DESTINATION_LINE" ]; then
            echo "Fallback: iPhone 17 simulator not found, using first supported iOS Simulator."
            DESTINATION_LINE=$(printf '%s\n' "$SHOW_DESTINATIONS" \
              | awk 'index($0, "platform:iOS Simulator") && /OS:/ && !/placeholder/ { print; exit }')
          fi

          DESTINATION_ID=$(printf '%s\n' "$DESTINATION_LINE" | sed -nE 's/.*id:([^,]+).*/\1/p')

          if [ -z "$DESTINATION_ID" ]; then
            echo "No iOS simulator destination found."
            printf '%s\n' "$SHOW_DESTINATIONS"
            exit 1
          fi

          DESTINATION="id=$DESTINATION_ID"
          echo "Resolved destination: $DESTINATION"
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"

      - name: Run demo tests
        run: |
          xcodebuild -project Examples/SVGSwiftUIDemo/SVGSwiftUIDemo.xcodeproj \
            -scheme SVGSwiftUIDemo \
            -destination "${{ steps.destination.outputs.destination }}" \
            -parallel-testing-enabled NO \
            test
