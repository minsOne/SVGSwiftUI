<svg width="360" height="220" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
    <rect id="smil-pulse-sun-bg" x="0" y="0" width="360" height="220" fill="#0a1120" />
    <g id="smil-pulse-sun-group">
        <circle id="smil-pulse-sun-core" cx="180" cy="110" r="38" fill="#f97316">
            <animate attributeName="r" values="22;44;22" dur="2.6s" repeatCount="indefinite" />
        </circle>
        <circle id="smil-pulse-sun-ring-1" cx="180" cy="110" r="62" fill="none" stroke="#fb7185" stroke-width="10" opacity="0.5">
            <animate attributeName="r" values="54;74;54" dur="2.6s" repeatCount="indefinite" />
        </circle>
        <circle id="smil-pulse-sun-ring-2" cx="180" cy="110" r="90" fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.4">
            <animate attributeName="r" values="82;106;82" dur="2.6s" repeatCount="indefinite" />
        </circle>
    </g>
    <g id="smil-pulse-rayset" transform="translate(180,110)">
        <polygon id="smil-pulse-ray" points="0,-102 4,-70 -4,-70" fill="#fde68a" />
        <polygon id="smil-pulse-ray-2" points="0,-102 4,-70 -4,-70" fill="#38bdf8" transform="rotate(60)" />
        <polygon id="smil-pulse-ray-3" points="0,-102 4,-70 -4,-70" fill="#a78bfa" transform="rotate(120)" />
        <polygon id="smil-pulse-ray-4" points="0,-102 4,-70 -4,-70" fill="#34d399" transform="rotate(180)" />
        <polygon id="smil-pulse-ray-5" points="0,-102 4,-70 -4,-70" fill="#f472b6" transform="rotate(240)" />
        <polygon id="smil-pulse-ray-6" points="0,-102 4,-70 -4,-70" fill="#818cf8" transform="rotate(300)" />
    </g>
</svg>
