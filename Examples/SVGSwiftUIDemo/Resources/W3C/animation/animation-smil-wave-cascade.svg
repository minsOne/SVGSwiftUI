<svg width="360" height="220" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
    <rect id="smil-wave-bg" x="0" y="0" width="360" height="220" fill="#101828" />
    <path id="smil-wave-path" d="M20 120 C80 40 140 200 200 120 C260 40 320 200 340 120" fill="none" stroke="#1d4ed8" stroke-width="6" />
    <g id="smil-wave-bubble-group">
        <circle id="smil-wave-bubble-1" cx="20" cy="120" r="9" fill="#38bdf8">
            <animate attributeName="cx" values="20;340;20" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle id="smil-wave-bubble-2" cx="20" cy="120" r="10" fill="#c084fc">
            <animate attributeName="cx" values="20;340;20" dur="4s" begin="0.6s" repeatCount="indefinite" />
        </circle>
        <circle id="smil-wave-bubble-3" cx="20" cy="120" r="8" fill="#22d3ee">
            <animate attributeName="cx" values="20;340;20" dur="4s" begin="1.2s" repeatCount="indefinite" />
        </circle>
    </g>
    <g id="smil-wave-grid">
        <line id="smil-wave-gridline-1" x1="0" y1="170" x2="360" y2="170" stroke="#1f2937" stroke-width="2" />
        <line id="smil-wave-gridline-2" x1="0" y1="195" x2="360" y2="195" stroke="#1f2937" stroke-width="2" />
    </g>
</svg>
