<svg width="260" height="220" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
  <rect id="smil-orbit-lumen-bg" x="0" y="0" width="260" height="220" fill="#020617"/>
  <g id="smil-orbit-lumen-core-group" transform="translate(130 110)">
    <circle id="smil-orbit-lumen-core" cx="0" cy="0" r="12" fill="#38bdf8"/>
    <circle id="smil-orbit-lumen-core-ring" cx="0" cy="0" r="34" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.8"/>
    <g id="smil-orbit-lumen-orbit">
      <g id="smil-orbit-lumen-satellite-0" transform="rotate(0)">
        <circle cx="56" cy="0" r="7" fill="#818cf8"/>
      </g>
      <g id="smil-orbit-lumen-satellite-1" transform="rotate(60)">
        <circle cx="56" cy="0" r="7" fill="#22d3ee"/>
      </g>
      <g id="smil-orbit-lumen-satellite-2" transform="rotate(120)">
        <circle cx="56" cy="0" r="7" fill="#f97316"/>
      </g>
      <g id="smil-orbit-lumen-satellite-3" transform="rotate(180)">
        <circle cx="56" cy="0" r="7" fill="#f43f5e"/>
      </g>
      <g id="smil-orbit-lumen-satellite-4" transform="rotate(240)">
        <circle cx="56" cy="0" r="7" fill="#fbbf24"/>
      </g>
      <g id="smil-orbit-lumen-satellite-5" transform="rotate(300)">
        <circle cx="56" cy="0" r="7" fill="#84cc16"/>
      </g>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="7s"
        repeatCount="indefinite"
      />
    </g>
    <polyline
      id="smil-orbit-lumen-spoke-0"
      points="0,0 56,0"
      stroke="#22d3ee"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
  </g>
  <g id="smil-orbit-lumen-trace" opacity="0.3" transform="translate(130 110)">
    <circle cx="0" cy="0" r="82" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 14"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="6 10"/>
  </g>
</svg>
