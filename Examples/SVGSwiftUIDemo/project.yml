name: SVGSwiftUIDemo
options:
  bundleIdPrefix: com.minsone
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
packages:
  SVGSwiftUI:
    path: ../..
targets:
  SVGSwiftUIDemo:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/animation-drift.svg
      - path: Resources/animation-pulse.svg
      - path: Resources/animation-luminous-core.svg
      - path: Resources/aurora-wave.svg
      - path: Resources/constellation-grid.svg
      - path: Resources/mesh-network.svg
      - path: Resources/badge.svg
      - path: Resources/geometry.svg
      - path: Resources/dense-grid-world.svg
      - path: Resources/orbital-lattice.svg
      - path: Resources/nested-groups.svg
      - path: Resources/panel.svg
      - path: Resources/path-commands.svg
      - path: Resources/polyline-ribbon.svg
      - path: Resources/polygon-polyline.svg
      - path: Resources/route.svg
      - path: Resources/spiral-paths.svg
      - path: Resources/style-inline.svg
      - path: Resources/style-sheet.svg
      - path: Resources/transform-radial-spiral.svg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsone.SVGSwiftUIDemo
        PRODUCT_NAME: SVGSwiftUIDemo
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SVGSwiftUI
        product: SVGSwiftUI

  SVGSwiftUIDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minsone.SVGSwiftUIDemoUITests
        TEST_TARGET_NAME: SVGSwiftUIDemo
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SVGSwiftUIDemo

schemes:
  SVGSwiftUIDemo:
    build:
      targets:
        SVGSwiftUIDemo: all
        SVGSwiftUIDemoUITests: [test]
    test:
      targets:
        - name: SVGSwiftUIDemoUITests
